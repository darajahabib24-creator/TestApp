name: Interactive Ubuntu Console

on:
  workflow_dispatch: # Allows you to manually trigger this from the GitHub Actions tab

jobs:
  interactive-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Launch Interactive SSH Terminal
        uses: owenthereal/action-upterm@v2
        with:
          ## Change this to false so it doesn't look for GitHub SSH keys
          limit-access-to-actor: false
          
          
