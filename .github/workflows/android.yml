name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/25.2.9519653
      P4A_STORAGE_DIR: ${{ runner.temp }}/p4a-storage

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. CRITICAL: Install Ubuntu native build dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libffi-dev libssl-dev xmldiff libltdl-dev unzip zip git

      # 2. CRITICAL: Set up the explicit Android NDK & SDK managers
      - name: Install Android SDK & NDK
        run: |
          mkdir -p ${{ env.ANDROID_HOME }}/cmdline-tools
          curl -sS https://google.com -o commandlinetools.zip
          unzip -q commandlinetools.zip -d ${{ env.ANDROID_HOME }}/cmdline-tools
          mv ${{ env.ANDROID_HOME }}/cmdline-tools/cmdline-tools ${{ env.ANDROID_HOME }}/cmdline-tools/latest
          
          # Accept licenses and install build tools + targeted NDK
          yes | ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"

      # 3. Pip install python-for-android if not already inside your build.sh
      - name: Install python-for-android
        run: pip install python-for-android

      - name: Build APK with p4a
        run: bash ./build.sh .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-launcher-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
          
