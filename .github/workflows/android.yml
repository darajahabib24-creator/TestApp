name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROIDSDK: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROIDNDK: ${{ runner.temp }}/android-sdk/ndk/25.2.9519653
      P4A_STORAGE_DIR: ${{ runner.temp }}/p4a-storage

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build APK with p4a
        run: bash ./build.sh .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-launcher-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
