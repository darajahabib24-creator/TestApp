name: Run Windows 11

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: Windows-11

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Run Windows 11
      uses:
       mcr.microsoft.com/windows/servercomcr.microsoft.com/windws/servercore:ltsc2022
      with:
        shell: powershell
        arguments: |
          Set-ExecutionPolicy
          Bypass -Scope CurrentUser -Force
          Start-Process
          powershell -ArgumentList "cd
          'C:\path\to\your\project' &&
          ./build-and-deploy.ps1" -Verb
          RunAs

    - name: Upload artifact
      uses:
       actions/upload-artifact@v2
      with:
        name: project
        path: ./dist
