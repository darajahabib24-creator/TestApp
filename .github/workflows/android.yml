name: Freeconnect Windows 11

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: Windows-11

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Deploy to GitHub
       Pages
      uses:
       actions/gh-pages@v2
      with:
        publish_dir: ./dist
